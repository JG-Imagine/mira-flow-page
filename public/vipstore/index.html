<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mira Flow — VIP Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F2E8; --sand: #EFE7D8; --navy: #0B2535; --gold: #B5842A; --forest: #3D5840; --brown: #8B6A52;
    --line: rgba(11, 37, 53, .14);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--cream); color: var(--navy); font-family: Jost, system-ui, sans-serif; font-weight: 300; line-height: 1.55; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; letter-spacing: .02em; text-decoration: none; }
  .hright { display: flex; align-items: center; gap: 14px; }
  .langs button { background: none; border: 0; font-size: .8rem; letter-spacing: .12em; color: var(--brown); cursor: pointer; padding: 4px 6px; }
  .langs button[aria-pressed="true"] { color: var(--navy); font-weight: 500; border-bottom: 1px solid var(--gold); }
  .cartbtn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); padding: 7px 12px; cursor: pointer; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
  .cartbtn .n { background: var(--navy); color: var(--cream); border-radius: 999px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; font-size: .72rem; letter-spacing: 0; padding: 0 6px; }
  .cartbtn .n:empty { display: none; }

  main { max-width: 1100px; margin: 0 auto; padding: 8px 24px 72px; }
  .eyebrow { font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.05; margin: 0 0 8px; }
  h2 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 2rem; line-height: 1.1; margin: 0; }
  .intro { max-width: 560px; color: var(--brown); margin: 0 0 32px; }
  .back { background: none; border: 0; padding: 0; cursor: pointer; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brown); margin-bottom: 24px; }
  .back:hover { color: var(--navy); }

  /* Catalogue */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .filters button { background: none; border: 1px solid var(--line); padding: 7px 16px; cursor: pointer; font-size: .85rem; }
  .filters button[aria-pressed="true"] { background: var(--navy); color: var(--cream); border-color: var(--navy); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px 24px; }
  .card { text-decoration: none; display: block; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  .card .img { aspect-ratio: 4/5; background: var(--sand); overflow: hidden; display: grid; place-items: center; margin-bottom: 12px; position: relative; }
  .card .img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
  .card:hover .img img { transform: scale(1.03); }
  .card .nm { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 500; line-height: 1.2; }
  .card .pr { font-weight: 400; margin-top: 2px; }
  .badge { position: absolute; top: 12px; left: 12px; background: var(--cream); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; padding: 4px 8px; }
  .card.soldout .img { opacity: .55; }

  /* Product */
  .product { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: start; }
  .gallery { display: grid; gap: 12px; }
  .gallery .main { aspect-ratio: 4/5; background: var(--sand); overflow: hidden; display: grid; place-items: center; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs { display: flex; gap: 10px; }
  .thumbs button { width: 72px; aspect-ratio: 4/5; padding: 0; border: 1px solid var(--line); background: var(--sand); cursor: pointer; overflow: hidden; }
  .thumbs button[aria-pressed="true"] { border-color: var(--navy); }
  .placeholder { width: 100%; height: 100%; display: grid; place-items: center; }
  .placeholder svg { width: 58%; height: auto; }
  .price { font-size: 1.25rem; margin: 6px 0 18px; font-weight: 400; }
  .desc { margin: 0 0 28px; }
  .field { margin-bottom: 24px; }
  .label { font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 10px; display: block; }
  .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .sizes button { min-width: 52px; padding: 10px 12px; border: 1px solid var(--line); background: transparent; font-weight: 400; cursor: pointer; }
  .sizes button[aria-pressed="true"] { background: var(--navy); color: var(--cream); border-color: var(--navy); }
  .sizes button:disabled { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
  .hint { font-size: .82rem; color: var(--forest); min-height: 1.2em; margin-top: 8px; }
  .qty { display: inline-flex; border: 1px solid var(--line); }
  .qty button { width: 38px; height: 38px; border: 0; background: none; font-size: 1.05rem; cursor: pointer; }
  .qty output { width: 36px; display: grid; place-items: center; font-weight: 400; }
  .primary { width: 100%; padding: 16px; border: 0; background: var(--navy); color: var(--cream); font-size: .85rem; letter-spacing: .22em; text-transform: uppercase; cursor: pointer; }
  .primary:hover { background: #12364c; }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .added { font-size: .9rem; color: var(--forest); min-height: 1.4em; margin-top: 10px; }
  .added button { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; color: var(--navy); }
  .error { color: #9b2c2c; font-size: .9rem; min-height: 1.3em; margin-top: 10px; }

  /* Cart */
  .cart { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: start; }
  .line { display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .line:first-child { border-top: 1px solid var(--line); }
  .line .thumb { width: 72px; aspect-ratio: 4/5; background: var(--sand); overflow: hidden; }
  .line .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .line .nm { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 500; line-height: 1.2; }
  .line .meta { font-size: .85rem; color: var(--brown); }
  .line .ctl { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .line .rm { background: none; border: 0; padding: 0; font-size: .8rem; color: var(--brown); text-decoration: underline; cursor: pointer; }
  .line .amt { font-weight: 400; white-space: nowrap; }
  .empty { padding: 24px 0; color: var(--brown); }
  .summary { background: rgba(239, 231, 216, .6); padding: 24px; }
  .delivery label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: .95rem; }
  .delivery input { accent-color: var(--navy); margin-top: 6px; }
  .delivery .cost { margin-left: auto; white-space: nowrap; font-weight: 400; }
  .row { display: flex; justify-content: space-between; margin: 8px 0; }
  .row.total { font-size: 1.1rem; font-weight: 400; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }
  .code-note { font-size: .85rem; color: var(--brown); margin: 6px 0 18px; }
  .fine { font-size: .78rem; color: var(--brown); margin-top: 18px; }

  .msg { max-width: 560px; padding: 32px 0; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 24px 14px; }
    .product, .cart { grid-template-columns: 1fr; gap: 28px; }
  }
  @media (max-width: 560px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .brand { font-size: 1.3rem; }
    .cartbtn .lbl { display: none; }
    .card .nm { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Mira Flow</a>
  <div class="hright">
    <nav class="langs" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="de">DE</button><button data-lang="pt">PT</button>
    </nav>
    <button class="cartbtn" id="cartBtn" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="lbl" data-t="cart"></span><span class="n" id="cartN"></span>
    </button>
  </div>
</header>

<main>
  <!-- Catalogue -->
  <section id="vList" hidden>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="title"></h1>
    <p class="intro" data-t="intro"></p>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Product -->
  <section id="vProduct" hidden>
    <button class="back" data-go="list" data-t="backShop"></button>
    <div class="product">
      <div class="gallery">
        <div class="main" id="mainImg"></div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <div>
        <h2 id="pName"></h2>
        <p class="price" id="pPrice"></p>
        <p class="desc" id="pDesc"></p>
        <div class="field" id="sizeField">
          <span class="label" data-t="size"></span>
          <div class="sizes" id="sizes" role="group"></div>
          <div class="hint" id="sizeHint"></div>
        </div>
        <div class="field">
          <span class="label" data-t="quantity"></span>
          <div class="qty">
            <button type="button" id="qMinus" aria-label="−">−</button>
            <output id="qVal">1</output>
            <button type="button" id="qPlus" aria-label="+">+</button>
          </div>
        </div>
        <button class="primary" id="addBtn" data-t="add"></button>
        <div class="error" id="pError" role="alert"></div>
        <div class="added" id="added" role="status"></div>
      </div>
    </div>
  </section>

  <!-- Cart -->
  <section id="vCart" hidden>
    <button class="back" data-go="list" data-t="keepShopping"></button>
    <h1 data-t="cartTitle"></h1>
    <div class="cart">
      <div id="lines"></div>
      <aside class="summary" id="summary">
        <div class="field delivery" id="delivery"><span class="label" data-t="delivery"></span></div>
        <div class="row"><span data-t="subtotal"></span><span id="sub"></span></div>
        <div class="row"><span data-t="shipping"></span><span id="ship"></span></div>
        <div class="row total"><span data-t="total"></span><span id="total"></span></div>
        <p class="code-note" data-t="codeNote"></p>
        <button class="primary" id="payBtn" data-t="pay"></button>
        <div class="error" id="cError" role="alert"></div>
        <p class="fine" data-t="fine"></p>
      </aside>
    </div>
  </section>

  <section class="msg" id="vThanks" hidden>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="thanksTitle"></h1>
    <p data-t="thanksBody"></p>
    <p><a href="/" data-t="backHome"></a></p>
  </section>

  <section class="msg" id="vClosed" hidden>
    <h1 data-t="closedTitle"></h1>
    <p data-t="closedBody"></p>
  </section>
</main>

<script>
const T = {
  en: {
    eyebrow: 'Members only', title: 'The VIP Store',
    intro: 'A small run of Mira Flow pieces for the people who have been part of it. Not sold anywhere else.',
    all: 'All', cart: 'Basket', backShop: '← All products', keepShopping: '← Keep shopping',
    size: 'Size', quantity: 'Quantity', add: 'Add to basket', selectSize: 'Please choose a size.',
    addedMsg: 'Added to your basket.', viewCart: 'View basket',
    left: n => `Only ${n} left in this size.`, soldOut: 'Sold out', lowStock: 'Few left',
    cartTitle: 'Your basket', empty: 'Your basket is empty.', remove: 'Remove',
    delivery: 'Delivery', subtotal: 'Subtotal', shipping: 'Delivery', total: 'Total', free: 'Free',
    codeNote: 'Have a VIP code? Enter it on the payment page.', pay: 'Continue to payment',
    maxItems: n => `Maximum ${n} items per order.`, notEnough: 'Not enough stock for that quantity.',
    err: 'Something went wrong. Please try again, or write to us.', errStock: 'One of your items just sold out in that size. Please adjust your basket.',
    fine: 'Secure payment by Stripe. 14-day right of withdrawal on unworn items. Shipping outside the EU (e.g. Switzerland) may involve customs handling.',
    thanksTitle: 'Thank you — it’s yours.', thanksBody: 'Your receipt is on its way by email. If you chose pickup, we’ll be in touch to arrange it; if you chose shipping, we’ll send it within a few working days.',
    backHome: 'Back to Mira Flow', closedTitle: 'The store is resting.', closedBody: 'Check back soon.'
  },
  de: {
    eyebrow: 'Nur für Mitglieder', title: 'Der VIP Store',
    intro: 'Eine kleine Auflage Mira Flow Stücke für alle, die schon dabei waren. Nirgendwo sonst erhältlich.',
    all: 'Alle', cart: 'Warenkorb', backShop: '← Alle Produkte', keepShopping: '← Weiter einkaufen',
    size: 'Größe', quantity: 'Anzahl', add: 'In den Warenkorb', selectSize: 'Bitte wähle eine Größe.',
    addedMsg: 'Zum Warenkorb hinzugefügt.', viewCart: 'Warenkorb ansehen',
    left: n => `Nur noch ${n} in dieser Größe.`, soldOut: 'Ausverkauft', lowStock: 'Nur noch wenige',
    cartTitle: 'Dein Warenkorb', empty: 'Dein Warenkorb ist leer.', remove: 'Entfernen',
    delivery: 'Lieferung', subtotal: 'Zwischensumme', shipping: 'Lieferung', total: 'Gesamt', free: 'Kostenlos',
    codeNote: 'Du hast einen VIP-Code? Gib ihn auf der Zahlungsseite ein.', pay: 'Weiter zur Zahlung',
    maxItems: n => `Maximal ${n} Artikel pro Bestellung.`, notEnough: 'Nicht genug auf Lager für diese Anzahl.',
    err: 'Etwas ist schiefgelaufen. Bitte versuche es erneut oder schreib uns.', errStock: 'Ein Artikel ist in dieser Größe gerade ausverkauft. Bitte passe deinen Warenkorb an.',
    fine: 'Sichere Zahlung über Stripe. 14 Tage Widerrufsrecht für ungetragene Artikel. Bei Versand außerhalb der EU (z. B. in die Schweiz) können Zollformalitäten anfallen.',
    thanksTitle: 'Danke — es gehört dir.', thanksBody: 'Deine Quittung kommt per E-Mail. Bei Abholung melden wir uns zur Vereinbarung; bei Versand schicken wir es innerhalb weniger Werktage los.',
    backHome: 'Zurück zu Mira Flow', closedTitle: 'Der Store macht gerade Pause.', closedBody: 'Schau bald wieder vorbei.'
  },
  pt: {
    eyebrow: 'Só para membros', title: 'A VIP Store',
    intro: 'Uma pequena edição de peças Mira Flow para quem já fez parte. Não está à venda em mais lado nenhum.',
    all: 'Tudo', cart: 'Cesto', backShop: '← Todos os produtos', keepShopping: '← Continuar a comprar',
    size: 'Tamanho', quantity: 'Quantidade', add: 'Adicionar ao cesto', selectSize: 'Escolhe um tamanho.',
    addedMsg: 'Adicionado ao cesto.', viewCart: 'Ver cesto',
    left: n => `Só restam ${n} neste tamanho.`, soldOut: 'Esgotado', lowStock: 'Últimas unidades',
    cartTitle: 'O teu cesto', empty: 'O teu cesto está vazio.', remove: 'Remover',
    delivery: 'Entrega', subtotal: 'Subtotal', shipping: 'Entrega', total: 'Total', free: 'Grátis',
    codeNote: 'Tens um código VIP? Introduz na página de pagamento.', pay: 'Continuar para pagamento',
    maxItems: n => `Máximo de ${n} artigos por encomenda.`, notEnough: 'Não há stock suficiente para essa quantidade.',
    err: 'Algo correu mal. Tenta novamente ou escreve-nos.', errStock: 'Um dos artigos acabou de esgotar nesse tamanho. Ajusta o teu cesto.',
    fine: 'Pagamento seguro via Stripe. 14 dias de direito de livre resolução em artigos não usados. Envios para fora da UE (ex. Suíça) podem implicar formalidades alfandegárias.',
    thanksTitle: 'Obrigado — já é tua.', thanksBody: 'O recibo segue por email. Se escolheste levantamento, entramos em contacto para combinar; se escolheste envio, seguirá dentro de poucos dias úteis.',
    backHome: 'Voltar à Mira Flow', closedTitle: 'A loja está em pausa.', closedBody: 'Volta em breve.'
  }
};

const $ = id => document.getElementById(id);
const CART_KEY = 'mf-vip-cart';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

const qs = new URLSearchParams(location.search);
const browser = (navigator.language || 'en').slice(0, 2);
let lang = ['en', 'de', 'pt'].includes(qs.get('lang')) ? qs.get('lang') : (['de', 'pt'].includes(browser) ? browser : 'en');

let catalog = null;
let cart = Array.isArray(store.get(CART_KEY)) ? store.get(CART_KEY) : [];   // [{productId, size, quantity}]
let delivery = 'pickup';
let filter = 'all';
let pv = { product: null, size: null, qty: 1, img: 0 };

const eur = c => new Intl.NumberFormat({ en: 'en-IE', de: 'de-DE', pt: 'pt-PT' }[lang], { style: 'currency', currency: 'EUR' }).format(c / 100);
const byId = id => catalog.products.find(p => p.id === id);
const TEE = '<div class="placeholder"><svg viewBox="0 0 200 200" fill="none" aria-hidden="true"><path d="M70 30 L40 45 L20 80 L45 92 L52 78 L52 175 L148 175 L148 78 L155 92 L180 80 L160 45 L130 30 C125 42 113 50 100 50 C87 50 75 42 70 30 Z" stroke="#0B2535" stroke-width="2" fill="#F7F2E8"/><text x="100" y="112" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="16" fill="#B5842A">Mira Flow</text></svg></div>';

function imgInto(box, src, alt) {
  if (!src) { box.innerHTML = TEE; return; }
  const im = new Image();
  im.alt = alt || ''; im.loading = 'lazy';
  im.onerror = () => { box.innerHTML = TEE; };
  im.src = src;
  box.replaceChildren(im);
}

/* ---------- routing ---------- */
function currentView() {
  const q = new URLSearchParams(location.search);
  if (q.get('ordered') === '1') return { v: 'thanks' };
  if (q.get('cart') === '1') return { v: 'cart' };
  if (q.get('p')) return { v: 'product', id: q.get('p') };
  return { v: 'list' };
}
function go(v, id) {
  const q = new URLSearchParams({ lang });
  if (v === 'product') q.set('p', id);
  if (v === 'cart') q.set('cart', '1');
  history.pushState(null, '', '?' + q);
  route();
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', route);

function route() {
  ['vList', 'vProduct', 'vCart', 'vThanks', 'vClosed'].forEach(id => $(id).hidden = true);
  const r = currentView();
  if (r.v === 'thanks') { cart = []; store.del(CART_KEY); updateCartBtn(); $('vThanks').hidden = false; return; }
  if (!catalog || !catalog.open || !catalog.products.length) { $('vClosed').hidden = false; $('cartBtn').hidden = true; return; }
  $('cartBtn').hidden = false;
  if (r.v === 'product' && byId(r.id)) {
    if (!pv.product || pv.product.id !== r.id) pv = { product: byId(r.id), size: null, qty: 1, img: 0 };
    const sizes = Object.keys(pv.product.sizes);
    if (sizes.length === 1 && pv.product.sizes[sizes[0]] !== 0) pv.size = sizes[0];
    $('added').textContent = ''; $('pError').textContent = '';
    renderProduct(); $('vProduct').hidden = false; return;
  }
  if (r.v === 'cart') { renderCart(); $('vCart').hidden = false; return; }
  renderList(); $('vList').hidden = false;
}

/* ---------- language ---------- */
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
  document.querySelectorAll('[data-t]').forEach(el => { const v = T[l][el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  const q = new URLSearchParams(location.search); q.set('lang', l);
  history.replaceState(null, '', '?' + q);
  if (catalog) route();
}

/* ---------- catalogue ---------- */
function stockState(p) {
  const v = Object.values(p.sizes);
  if (v.every(x => x === 0)) return 'out';
  if (v.every(x => x !== 'ok')) return 'low';
  return 'ok';
}
function renderList() {
  const cats = catalog.categories;
  $('filters').hidden = cats.length < 2;
  $('filters').replaceChildren(...[{ id: 'all', label: null }, ...cats].map(c => {
    const b = document.createElement('button');
    b.textContent = c.id === 'all' ? T[lang].all : c.label[lang];
    b.setAttribute('aria-pressed', filter === c.id);
    b.onclick = () => { filter = c.id; renderList(); };
    return b;
  }));
  const items = catalog.products.filter(p => filter === 'all' || p.category === filter);
  $('grid').replaceChildren(...items.map(p => {
    const st = stockState(p);
    const a = document.createElement('a');
    a.className = 'card' + (st === 'out' ? ' soldout' : '');
    a.href = `?p=${encodeURIComponent(p.id)}&lang=${lang}`;
    a.onclick = e => { e.preventDefault(); go('product', p.id); };
    a.innerHTML = '<div class="img"></div><div class="nm"></div><div class="pr"></div>';
    imgInto(a.children[0], p.images[0], p.name[lang]);
    if (st !== 'ok') { const s = document.createElement('span'); s.className = 'badge'; s.textContent = st === 'out' ? T[lang].soldOut : T[lang].lowStock; a.children[0].append(s); }
    a.children[1].textContent = p.name[lang];
    a.children[2].textContent = eur(p.price);
    return a;
  }));
}

/* ---------- product ---------- */
function inCart(pid, size) { return cart.filter(l => l.productId === pid && l.size === size).reduce((s, l) => s + l.quantity, 0); }
function cartCount() { return cart.reduce((s, l) => s + l.quantity, 0); }
function maxFor(p, size) {
  const a = p.sizes[size];
  const stock = typeof a === 'number' ? a : Infinity;
  return Math.max(0, Math.min(stock - inCart(p.id, size), catalog.maxItemsPerOrder - cartCount()));
}

function renderProduct() {
  const p = pv.product;
  $('pName').textContent = p.name[lang];
  $('pDesc').textContent = p.description[lang];
  $('pPrice').textContent = eur(p.price);

  const imgs = p.images;
  const show = i => {
    pv.img = i;
    imgInto($('mainImg'), imgs[i], p.name[lang]);
    [...$('thumbs').children].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  };
  $('thumbs').replaceChildren(...(imgs.length > 1 ? imgs.map((src, i) => {
    const b = document.createElement('button'); b.type = 'button';
    const im = new Image(); im.src = src; im.alt = ''; im.onerror = () => b.remove();
    b.append(im); b.onclick = () => show(i);
    return b;
  }) : []));
  show(Math.min(pv.img, Math.max(imgs.length - 1, 0)));

  const sizeKeys = Object.keys(p.sizes);
  $('sizeField').hidden = sizeKeys.length === 1;
  $('sizes').replaceChildren(...sizeKeys.map(s => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
    b.disabled = p.sizes[s] === 0;
    if (b.disabled) b.title = T[lang].soldOut;
    b.setAttribute('aria-pressed', s === pv.size);
    b.onclick = () => { pv.size = s; pv.qty = 1; $('pError').textContent = ''; renderProduct(); };
    return b;
  }));
  const a = pv.size ? p.sizes[pv.size] : null;
  $('sizeHint').textContent = typeof a === 'number' && a > 0 ? T[lang].left(a) : '';
  $('qVal').textContent = pv.qty;
  $('addBtn').disabled = stockState(p) === 'out';
}

$('qMinus').onclick = () => { pv.qty = Math.max(1, pv.qty - 1); renderProduct(); };
$('qPlus').onclick = () => {
  const m = pv.size ? maxFor(pv.product, pv.size) : catalog.maxItemsPerOrder - cartCount();
  if (pv.qty < m) pv.qty++;
  renderProduct();
};
$('addBtn').onclick = () => {
  $('pError').textContent = ''; $('added').textContent = '';
  if (!pv.size) { $('pError').textContent = T[lang].selectSize; return; }
  if (cartCount() + pv.qty > catalog.maxItemsPerOrder) { $('pError').textContent = T[lang].maxItems(catalog.maxItemsPerOrder); return; }
  if (pv.qty > maxFor(pv.product, pv.size)) { $('pError').textContent = T[lang].notEnough; return; }
  const ex = cart.find(l => l.productId === pv.product.id && l.size === pv.size);
  if (ex) ex.quantity += pv.qty; else cart.push({ productId: pv.product.id, size: pv.size, quantity: pv.qty });
  saveCart();
  pv.qty = 1; renderProduct();
  $('added').innerHTML = '';
  $('added').append(T[lang].addedMsg + ' ');
  const v = document.createElement('button'); v.textContent = T[lang].viewCart; v.onclick = () => go('cart');
  $('added').append(v);
};

/* ---------- cart ---------- */
function saveCart() { store.set(CART_KEY, cart); updateCartBtn(); }
function updateCartBtn() { const n = cartCount(); $('cartN').textContent = n ? n : ''; }
function cleanCart() {
  // drop items no longer sold; clamp to stock
  cart = cart.filter(l => { const p = byId(l.productId); return p && l.size in p.sizes && p.sizes[l.size] !== 0; })
    .map(l => { const a = byId(l.productId).sizes[l.size]; return { ...l, quantity: typeof a === 'number' ? Math.min(l.quantity, a) : l.quantity }; });
  saveCart();
}

function renderCart() {
  const box = $('lines');
  $('cError').textContent = '';
  if (!cart.length) {
    box.innerHTML = '';
    const p = document.createElement('p'); p.className = 'empty'; p.textContent = T[lang].empty;
    box.append(p); $('summary').hidden = true; return;
  }
  $('summary').hidden = false;
  box.replaceChildren(...cart.map((l, i) => {
    const p = byId(l.productId);
    const d = document.createElement('div'); d.className = 'line';
    d.innerHTML = `<div class="thumb"></div><div><div class="nm"></div><div class="meta"></div><div class="ctl"><div class="qty"><button type="button" aria-label="−">−</button><output></output><button type="button" aria-label="+">+</button></div><button class="rm"></button></div></div><div class="amt"></div>`;
    imgInto(d.querySelector('.thumb'), p.images[0], '');
    d.querySelector('.nm').textContent = p.name[lang];
    d.querySelector('.meta').textContent = Object.keys(p.sizes).length > 1 ? `${T[lang].size}: ${l.size}` : '';
    d.querySelector('output').textContent = l.quantity;
    d.querySelector('.amt').textContent = eur(p.price * l.quantity);
    const [minus, plus] = d.querySelectorAll('.qty button');
    minus.onclick = () => { if (l.quantity > 1) { l.quantity--; saveCart(); renderCart(); } };
    plus.onclick = () => { if (maxFor(p, l.size) > 0) { l.quantity++; saveCart(); renderCart(); } };
    const rm = d.querySelector('.rm'); rm.textContent = T[lang].remove;
    rm.onclick = () => { cart.splice(i, 1); saveCart(); renderCart(); };
    return d;
  }));

  const dbox = $('delivery');
  dbox.querySelectorAll('label').forEach(x => x.remove());
  Object.entries(catalog.delivery).forEach(([k, d]) => {
    const lb = document.createElement('label');
    lb.innerHTML = `<input type="radio" name="delivery" value="${k}" ${k === delivery ? 'checked' : ''}><span></span><span class="cost"></span>`;
    lb.children[1].textContent = d.label[lang];
    lb.children[2].textContent = d.price ? eur(d.price) : T[lang].free;
    lb.querySelector('input').onchange = () => { delivery = k; renderCart(); };
    dbox.append(lb);
  });
  const sub = cart.reduce((s, l) => s + byId(l.productId).price * l.quantity, 0);
  const ship = catalog.delivery[delivery].price;
  $('sub').textContent = eur(sub);
  $('ship').textContent = ship ? eur(ship) : T[lang].free;
  $('total').textContent = eur(sub + ship);
}

$('payBtn').onclick = async () => {
  $('cError').textContent = '';
  $('payBtn').disabled = true;
  try {
    const res = await fetch('/api/vipstore/checkout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: cart, delivery, lang })
    });
    const data = await res.json();
    if (data.url) { location.href = data.url; return; }
    $('cError').textContent = data.error === 'out_of_stock' ? T[lang].errStock
      : data.error === 'too_many_items' ? T[lang].maxItems(catalog.maxItemsPerOrder) : T[lang].err;
  } catch { $('cError').textContent = T[lang].err; }
  $('payBtn').disabled = false;
};

/* ---------- init ---------- */
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
$('cartBtn').onclick = () => go('cart');

(async function init() {
  setLang(lang);
  if (currentView().v !== 'thanks') {
    try { catalog = await (await fetch('/api/vipstore/catalog', { cache: 'no-store' })).json(); } catch { catalog = null; }
    if (catalog && catalog.products) cleanCart();
  }
  updateCartBtn();
  route();
})();
</script>
</body>
</html>
